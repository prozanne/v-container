# Builds the Windows release assets when a v* tag is pushed:
#   vc-setup-<ver>.exe            per-user installer (vc + bundled QEMU, PATH)
#   vc-<ver>-windows-x86_64.zip   the same tree, portable
#   vc.exe                        standalone binary
#   SHA256SUMS.txt
# workflow_dispatch runs the whole pipeline (tests, packaging, smoke) as a dry
# run without publishing a release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve version
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          "VER=$ver" | Add-Content $env:GITHUB_ENV
          Write-Host "version: $ver"

      - name: Test
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet failed' }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'go test failed' }

      - name: Build vc.exe
        env:
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags "-s -w -X github.com/prozanne/v-container/internal/cli.Version=$env:VER" -o stage/vc.exe ./cmd/vc
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }

      - name: Cache QEMU installer download
        uses: actions/cache@v4
        with:
          path: build/qemu-work/qemu-w64-setup-20260501.exe
          key: qemu-w64-setup-20260501

      - name: Fetch and prune QEMU
        run: pwsh -NoProfile -File packaging/windows/get-qemu.ps1 -OutDir stage/qemu -WorkDir build/qemu-work

      - name: Smoke test the staged tree
        run: |
          & stage/qemu/qemu-system-x86_64.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'bundled qemu failed to run (missing DLLs?)' }

          $v = & stage/vc.exe version
          if ($LASTEXITCODE -ne 0) { throw 'vc version failed' }
          if (-not ("$v" -match [regex]::Escape($env:VER))) { throw "vc reports '$v', expected $env:VER" }

          # setup exits nonzero unless vc can locate QEMU — proves the
          # exe-adjacent qemu\ bundle is discovered on a real Windows host.
          & stage/vc.exe setup
          if ($LASTEXITCODE -ne 0) { throw 'vc setup did not find the bundled qemu' }

          & stage/vc.exe doctor   # diagnostic output for the build log; always exits 0

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=$env:VER "/DStageDir=$PWD\stage" "/DOutputDir=$PWD\dist" packaging/windows/vc.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }

      - name: Build portable zip and checksums
        run: |
          & "${env:ProgramFiles}\7-Zip\7z.exe" a "dist/vc-$env:VER-windows-x86_64.zip" './stage/*'
          if ($LASTEXITCODE -ne 0) { throw '7z failed' }
          Copy-Item stage/vc.exe dist/vc.exe
          Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/vc-setup-*.exe
            dist/vc-*-windows-x86_64.zip
            dist/vc.exe
            dist/SHA256SUMS.txt
